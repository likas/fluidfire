name: Convert Markdown to HTML and Deploy

on:
  push:
    branches:
      - main # The script will run when you push to the main branch

permissions:
  contents: write # Allow the bot to write the generated HTML back to the repository

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the code from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. Deploy the generated index.html to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . # Allow the bot to write the generated HTML back to the repository
          branch: gh-pages # The bot will create this branch and put the index.html file there
  # Versioned PDF - only on tag pushes like v1, v2, ...
  release-pdf:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: deploy-pages
    steps:
      - uses: actions/checkout@v4

      # 1. Look for a browser already installed in the runner
      - name: Detect pre-installed browser
        run: |
          for candidate in google-chrome google-chrome-stable chromium chromium-browser chrome; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "BROWSER_BIN=$(command -v "$candidate")" >> "$GITHUB_ENV"
              echo "Found pre-installed browser: $candidate"
              break
            fi
          done
          if [ -z "$BROWSER_BIN" ]; then
            echo "No pre-installed browser found."
          fi

      # 2. If no browser is present, install one via setup-chrome
      - name: Install Chrome if needed
        if: env.BROWSER_BIN == ''
        uses: browser-actions/setup-chrome@v1

      - name: Resolve installed Chrome path
        if: env.BROWSER_BIN == ''
        run: echo "BROWSER_BIN=$(command -v chrome)" >> "$GITHUB_ENV"

      # 3. Generate the PDF
      - name: Generate PDF
        run: |
          echo "Using browser: $BROWSER_BIN"
          "$BROWSER_BIN" \
            --headless \
            --disable-gpu \
            --no-sandbox \
            --disable-dev-shm-usage \
            --no-pdf-header-footer \
            --print-to-pdf-no-header \
            --print-to-pdf=resume.pdf \
            "file://${{ github.workspace }}/index.html"

      # 4. Stash the PDF in a temp location before switching branches
      - name: Stash PDF
        run: cp resume.pdf /tmp/resume.pdf

      # 5. Prepare the releases branch
      - name: Prepare releases branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin releases:refs/remotes/origin/releases || true
          if git show-ref --verify --quiet refs/remotes/origin/releases; then
            git checkout -B releases origin/releases
          else
            git checkout --orphan releases
            git rm -rf . || true
          fi

      # 6. Copy the PDF into place and commit
      - name: Add PDF and commit
        env:
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cp /tmp/resume.pdf "resume-${TAG_NAME}.pdf"
          git add "resume-${TAG_NAME}.pdf"
          git commit -m "Add resume PDF for ${TAG_NAME} (${COMMIT_SHA})" || echo "No changes to commit"
          git push origin releases

      # 7. Also upload as a run artifact (handy for quick download, kept for 90 days)
      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-${{ github.ref_name }}
          path: /tmp/resume.pdf
          retention-days: 90